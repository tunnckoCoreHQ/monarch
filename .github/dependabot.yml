version: 2

updates:
  # Workflow actions. Pins stay as commit SHAs; Dependabot bumps the SHA and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # The pnpm workspace. One root entry covers every package.json and the catalogs in pnpm-workspace.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    # Never take a release younger than a week.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # One PR per week for everything that is not a major bump.
      minor-and-patch:
        update-types: ["minor", "patch"]
        patterns: ["*"]
    ignore:
      # Pinned on purpose. Bump by hand.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
