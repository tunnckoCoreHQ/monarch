# Checks and tests every pull request and every push to master. After a master push passes,
# nightly publishes the packages that push changed and release keeps the release PR current or,
# when a release PR was merged, publishes stable versions with tags and GitHub Releases.
#
# SECURITY: check and test run PR code with a read-only token and no secrets. nightly and release
# run only for master pushes. Each carries a GitHub environment; npm.wgw.lol reads that claim from
# the OIDC token and allows only the matching dist-tag. The PAT is used by changesets/action so
# the release PR is a real user PR that receives checks; it never reaches jobs that run PR code.

name: typescript

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Master pushes, manual master runs, and same-repository pull requests, Dependabot included.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          sfw: true
          cache: true
          run-install: true
          node-version: "lts"
      # Vite+ task cache, restored after install so vp run replays unchanged tasks.
      - id: task-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}-check
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-
      - run: vp run check
      - if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.task-cache.outputs.cache-primary-key }}

  # The master ruleset requires this job. Keep its name.
  test:
    needs: check
    permissions:
      contents: read
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          sfw: true
          cache: true
          run-install: true
          node-version: "lts"
      - id: task-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}-test
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-
      - run: vp run test
      - if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.task-cache.outputs.cache-primary-key }}

  nightly:
    needs: test
    if: github.event_name == 'push'
    environment: nightly
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: packages-nightly
      cancel-in-progress: false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          sfw: true
          cache: true
          run-install: true
          node-version: "lts"
      # Nightly publishes only what this push changed. Pending changesets for other packages stay
      # untouched for their stable release. pnpm exchanges the GitHub OIDC token at npm.wgw.lol.
      - name: Publish nightlies for the packages this push changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base=$BEFORE
          git cat-file -e "$base^{commit}" 2>/dev/null || base=HEAD~1
          # Changed workspace packages and their dependents, read before snapshot versioning edits manifests.
          changed=$(pnpm ls --filter "...[$base]" --depth -1 --json | jq -r '.[].name')
          if ! compgen -G '.changeset/*.md' > /dev/null; then
            echo "Not published: no pending changesets" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pnpm changeset version --snapshot nightly
          published=()
          for manifest in $(git diff --name-only -- 'packages/*/package.json'); do
            name=$(jq -r .name "$manifest")
            grep -qxF "$name" <<< "$changed" || continue
            pnpm --filter "$name" publish --tag nightly --no-git-checks
            published+=("$name@$(jq -r .version "$manifest")")
          done
          if [ "${#published[@]}" -eq 0 ]; then
            echo "Not published: this push changed no package with a pending changeset" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            printf 'Published %s with nightly\n' "${published[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  release:
    needs: test
    if: github.event_name == 'push'
    environment: latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: packages-release
      cancel-in-progress: false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          sfw: true
          cache: true
          run-install: true
          node-version: "lts"
      # With pending changesets this opens or updates the release PR. Publishing runs only for the
      # merged release PR itself, so a new package cannot reach latest without a reviewed release.
      - uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          github-token: ${{ secrets.OLSTENLARCK_HQ_PAT }}
          version-script: vp run packages:version
          publish-script: "${{ startsWith(github.event.head_commit.message, 'chore: release packages') && 'pnpm changeset publish' || '' }}"
          commit-message: "chore: release packages"
          pr-title: "chore: release packages"
