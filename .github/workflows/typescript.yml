# Runs checks and tests for master pushes, explicit master dispatches, and same-repository PRs.
# Automated merges dispatch this workflow because GITHUB_TOKEN merges do not trigger push runs.
# Dependabot PRs have a separate workflow.
#
# SECURITY: check_test executes PR code and has read-only access. Publishing jobs run only after
# successful checks on master, with OIDC scoped to those jobs. commit_status runs no repository code
# and records results on the tested commit, including commits supplied by automated dispatches.

name: typescript

on:
  workflow_dispatch:
    inputs:
      merge_sha:
        description: Merged master commit to check; defaults to the current master commit.
        type: string
        required: false
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.merge_sha || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check_test:
    name: TypeScript checks and tests
    outputs:
      sha: ${{ steps.checked.outputs.sha }}
      packages: ${{ steps.checked.outputs.packages }}
    permissions:
      contents: read
    # Manual and automated dispatches may test only master, never a PR branch.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.actor != 'dependabot[bot]' &&
        ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
          (github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository)))
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - if: github.event_name != 'pull_request'
        env:
          CHECKED_SHA: ${{ inputs.merge_sha || github.sha }}
        run: |
          [[ "$CHECKED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$CHECKED_SHA" origin/master
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          sfw: true
          cache: true
          run-install: true
          node-version: "lts"
      # Vite+ task cache, restored after install so vp run replays unchanged tasks.
      - id: task-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-
      - run: vp run check
      - run: vp run test
      - id: checked
        if: github.event_name != 'pull_request'
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -n "$(git diff --name-only HEAD^ HEAD -- packages/)" ]; then
            echo "packages=true" >> "$GITHUB_OUTPUT"
          fi
      - if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.task-cache.outputs.cache-primary-key }}

  nightly:
    needs: check_test
    if: >-
      github.repository == 'tunnckoCoreHQ/monarch' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.check_test.outputs.packages == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/packages-nightly.yml
    with:
      sha: ${{ needs.check_test.outputs.sha }}

  release:
    needs: check_test
    if: >-
      github.repository == 'tunnckoCoreHQ/monarch' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.check_test.outputs.packages == 'true'
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/packages-release.yml
    with:
      sha: ${{ needs.check_test.outputs.sha }}

  commit_status:
    needs: [check_test, nightly, release]
    if: >-
      always() && github.repository == 'tunnckoCoreHQ/monarch' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      statuses: write
    steps:
      # Report against the tested merge commit, even if master advanced before dispatch started.
      - env:
          GH_TOKEN: ${{ github.token }}
          CHECKED_SHA: ${{ inputs.merge_sha || github.sha }}
          CHECK_RESULT: ${{ needs.check_test.result }}
          NIGHTLY_RESULT: ${{ needs.nightly.result }}
          NIGHTLY_REPORT: ${{ needs.nightly.outputs.report }}
        run: |
          [[ "$CHECKED_SHA" =~ ^[0-9a-f]{40}$ ]]
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          state=failure
          [ "$CHECK_RESULT" != success ] || state=success
          gh api "repos/$GITHUB_REPOSITORY/statuses/$CHECKED_SHA" \
            -f state="$state" -f context=typescript -f description="Checks: $CHECK_RESULT" -f target_url="$url"
          state=failure
          description="Nightly: $NIGHTLY_RESULT"
          if [ "$NIGHTLY_RESULT" = success ] && [ -n "$NIGHTLY_REPORT" ]; then
            state=success
            description="$NIGHTLY_REPORT"
          elif [ "$NIGHTLY_RESULT" = skipped ] && [ "$CHECK_RESULT" = success ]; then
            state=success
            description="Not published: no packages changed"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$CHECKED_SHA" \
            -f state="$state" -f context=packages-nightly -f description="${description:0:140}" -f target_url="$url"
