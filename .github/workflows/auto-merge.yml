name: auto-merge

# Merges Dependabot pull requests once every check on the head commit has passed.
# Runs on workflow_run so it executes trusted code from master with a write token,
# while the pull request workflows themselves stay read-only.
on:
  workflow_run:
    workflows: [checks, triad-auth, solidity]
    types: [completed]

# One job per head commit; later workflow_run events for the same commit queue behind it and exit early once merged.
concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --author 'app/dependabot' \
            --json number,headRefOid --jq ".[] | select(.headRefOid == \"$HEAD_SHA\") | .number" | head -1)
          if [ -z "$pr" ]; then
            echo "no open Dependabot pull request at $HEAD_SHA"
            exit 0
          fi
          # Wait for every remaining check on this commit. Non-zero exit means one failed.
          gh pr checks "$pr" --repo "$GITHUB_REPOSITORY" --watch --fail-fast
          state=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json state --jq .state)
          if [ "$state" != "OPEN" ]; then
            echo "pull request #$pr is $state, nothing to do"
            exit 0
          fi
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
