name: auto-merge

# Merges a pull request from an owner, member, or collaborator once every check on its head commit is green.
# Runs on workflow_run so it executes trusted code from master with a write token.
on:
  workflow_run:
    workflows: [typescript, solidity]
    types: [completed]

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
            --jq ".[] | select(.head.sha == \"$HEAD_SHA\" and .user.type != \"Bot\" and (.author_association | IN(\"OWNER\", \"MEMBER\", \"COLLABORATOR\"))) | .number" | head -1)
          if [ -z "$pr" ]; then
            echo "no eligible open pull request at $HEAD_SHA"
            exit 0
          fi
          # Wait for every remaining check on this commit. Non-zero exit means one failed.
          gh pr checks "$pr" --repo "$GITHUB_REPOSITORY" --watch --fail-fast
          state=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json state --jq .state)
          if [ "$state" != "OPEN" ]; then
            echo "pull request #$pr is $state, nothing to do"
            exit 0
          fi
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
