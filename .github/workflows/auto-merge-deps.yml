# Approves Dependabot pull requests and enables GitHub auto-merge on them. The master ruleset
# requires one approval, which the PAT owner gives here; GitHub merges once the required checks
# pass, using the PAT owner's identity so the merge triggers the master workflows like any push.
#
# SECURITY: the job runs no repository code. The PAT comes from Dependabot secrets and is used
# only to approve and enable auto-merge. Keep the actor gate; do not extend it to other authors.

name: auto-merge-deps

on:
  pull_request:
    branches: [master]

permissions: {}

jobs:
  enable_auto_merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - env:
          GH_TOKEN: ${{ secrets.OLSTENLARCK_HQ_PAT }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr review "$PR" --repo "$GITHUB_REPOSITORY" --approve --body "Dependabot update; merges when the required checks pass."
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash
