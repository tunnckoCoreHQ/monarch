# Enables GitHub auto-merge on Dependabot pull requests. GitHub merges them once the master
# ruleset's required check passes, using the PAT owner's identity so the merge triggers the
# master workflows like any other push.
#
# SECURITY: the job runs no repository code. The PAT comes from Dependabot secrets and is used
# only to enable auto-merge. Keep the actor gate; do not extend it to other PR authors.

name: auto-merge-deps

on:
  pull_request:
    branches: [master]

permissions: {}

jobs:
  enable_auto_merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.OLSTENLARCK_HQ_PAT }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash
