# Opens or updates a release PR every Monday at 06:00 UTC, or when run manually. Publishes stable
# packages, tags, and GitHub Releases when typescript.yml calls it after the merged commit passes.
#
# SECURITY: passing CI alone must not authorize a stable release. pkgs_identify matches the tested
# commit to a merged changeset-release/master PR in this repository. Keep pkgs_publish dependent on
# that result and checked out at the same SHA; otherwise it could publish an ordinary PR or untested
# code.
#
# Only pkgs_publish gets OIDC permission. vlt-front-worker at npm.wgw.lol limits its token to latest
# writes.

name: packages-release

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string

permissions: {}

jobs:
  pkgs_prepare:
    if: github.repository == 'tunnckoCoreHQ/monarch' && github.ref == 'refs/heads/master' && inputs.sha == ''
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: packages-version
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          sfw: true
          cache: true
          run-install: true
          node-version: "lts"
      - uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2
        with:
          version-script: vp run packages:version
          commit-message: "chore: release packages"
          pr-title: "chore: release packages"
          pr-base-branch: master

  pkgs_identify:
    if: >-
      github.repository == 'tunnckoCoreHQ/monarch' &&
      github.ref == 'refs/heads/master' && inputs.sha != '' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.pr.outputs.release }}
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          release=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/pulls" \
            --jq ".[] | select(.merged_at != null and .merge_commit_sha == \"$RELEASE_SHA\" and .head.ref == \"changeset-release/master\" and .head.repo.full_name == \"$GITHUB_REPOSITORY\" and .base.ref == \"master\" and .base.repo.full_name == \"$GITHUB_REPOSITORY\") | .number")
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

  pkgs_publish:
    needs: pkgs_identify
    if: needs.pkgs_identify.outputs.release != ''
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: packages-latest
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pkgs_identify.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          sfw: true
          cache: true
          run-install: true
          node-version: "lts"
      - run: vp run packages:release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ needs.pkgs_identify.outputs.release }}
