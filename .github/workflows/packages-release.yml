name: packages-release

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
  workflow_run:
    workflows: [typescript]
    types: [completed]
    branches: [master]

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'tunnckoCoreHQ/monarch' && github.ref == 'refs/heads/master' && github.event_name != 'workflow_run'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: packages-version
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          sfw: true
          cache: true
          run-install: true
          node-version: "lts"
      - uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2
        with:
          version-script: vp run packages:version
          commit-message: "chore: release packages"
          pr-title: "chore: release packages"
          pr-base-branch: master

  identify:
    if: >-
      github.repository == 'tunnckoCoreHQ/monarch' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.pr.outputs.release }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          release=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/pulls" \
            --jq ".[] | select(.merged_at != null and .merge_commit_sha == \"$RELEASE_SHA\" and .head.ref == \"changeset-release/master\" and .head.repo.full_name == \"$GITHUB_REPOSITORY\" and .base.ref == \"master\" and .base.repo.full_name == \"$GITHUB_REPOSITORY\") | .number")
          echo "release=$release" >> "$GITHUB_OUTPUT"

  publish:
    needs: identify
    if: needs.identify.outputs.release != ''
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: packages-latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          sfw: true
          cache: true
          run-install: true
          node-version: "lts"
      - run: vp run packages:release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ needs.identify.outputs.release }}
