# Runs Socket Optimize CLI to optimize dependencies at `socket-optimize` brnach on Monday at 06:00
# UTC or manually, then opens and merges a PR if validation passes.
#
# SECURITY: this job can access the Socket secret and write to the repository. Keep the master-only
# guard: without it, a manual run could execute modified workflow code with those credentials.
#
# Checkout avoids persisted Git credentials, but actions can still access the job token. Keep
# validation before the final push and merge.
# Dispatch typescript after merging: GITHUB_TOKEN merges do not trigger push workflows.

name: socket-optimize

on:
  schedule:
    # Mondays 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: socket-optimize
  cancel-in-progress: false

jobs:
  socket_optimize:
    permissions:
      actions: write
      contents: write
      pull-requests: write
    # Only the default branch may run this, including manual dispatches, so a modified branch cannot reach the secrets or push.
    if: github.ref == 'refs/heads/master'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      BRANCH: socket-optimize
    steps:
      # SHA-pinned
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Avoid leaving a write credential in Git's local config.
          persist-credentials: false
      # SHA-pinned
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          sfw: true
          cache: true
          run-install: true
          node-version: "lts"
      # SHA-pinned
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.7.1
      - run: pnpm dlx socket@1.1.167 optimize
        env:
          SOCKET_SECURITY_API_TOKEN: ${{ secrets.SOCKET_SECURITY_API_TOKEN }}
      - id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.changed == 'true'
        run: pnpm install --no-frozen-lockfile
      - if: steps.diff.outputs.changed == 'true'
        run: vp run check
      - if: steps.diff.outputs.changed == 'true'
        run: vp run test
      - if: steps.diff.outputs.changed == 'true'
        run: vp run solidity:check
      - if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "$BRANCH"
          git add -A
          git commit -m "chore(deps): apply socket optimize overrides"
          # Give Git push its credential only after validation passes.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "$BRANCH"
          if ! gh pr view "$BRANCH" --repo "$GITHUB_REPOSITORY" --json number >/dev/null 2>&1; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base master --head "$BRANCH" \
              --title "chore(deps): apply socket optimize overrides" \
              --body "Weekly socket optimize run. Check, test, and solidity passed in the job before this pull request was opened."
          fi
          # The master ruleset requires a pull request; this is it. Verification already happened above.
          gh pr merge "$BRANCH" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
          gh workflow run typescript.yml --repo "$GITHUB_REPOSITORY" --ref master
