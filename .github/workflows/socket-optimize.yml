# Runs Socket Optimize on Monday at 06:00 UTC or manually. When it changes anything, opens a pull
# request as the PAT owner and enables auto-merge, so the PR gets the normal checks and GitHub
# merges it when the required check passes.
#
# SECURITY: this job can read the Socket secret and the PAT. Keep the master-only guard: without
# it, a manual run could execute modified workflow code with those credentials.

name: socket-optimize

on:
  schedule:
    # Mondays 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: socket-optimize
  cancel-in-progress: false

jobs:
  socket_optimize:
    permissions:
      contents: read
    # Only the default branch may run this, including manual dispatches, so a modified branch cannot reach the secrets.
    if: github.ref == 'refs/heads/master'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    env:
      BRANCH: socket-optimize
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Avoid leaving a write credential in Git's local config.
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          sfw: true
          cache: true
          run-install: true
          node-version: "lts"
      - run: pnpm dlx socket@1.1.167 optimize
        env:
          SOCKET_SECURITY_API_TOKEN: ${{ secrets.SOCKET_SECURITY_API_TOKEN }}
      - id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.changed == 'true'
        run: pnpm install --no-frozen-lockfile
      - if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.OLSTENLARCK_HQ_PAT }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "$BRANCH"
          git add -A
          git commit -m "chore(deps): apply socket optimize overrides"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "$BRANCH"
          if ! gh pr view "$BRANCH" --repo "$GITHUB_REPOSITORY" --json number >/dev/null 2>&1; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base master --head "$BRANCH" \
              --title "chore(deps): apply socket optimize overrides" \
              --body "Weekly Socket Optimize run. Merges automatically once the required checks pass."
          fi
          gh pr merge "$BRANCH" --repo "$GITHUB_REPOSITORY" --auto --squash
