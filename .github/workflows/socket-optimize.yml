name: socket-optimize

on:
  schedule:
    # Mondays 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: socket-optimize
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned; let Renovate bump it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing before the final step may hold write credentials.
          persist-credentials: false
      # SHA-pinned; let Renovate bump it
      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          sfw: true
          cache: true
          run-install: true
          node-version: "lts"
      - run: pnpm dlx socket@1.1.167 optimize
        env:
          SOCKET_SECURITY_API_TOKEN: ${{ secrets.SOCKET_SECURITY_API_TOKEN }}
      - id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.changed == 'true'
        run: pnpm install --no-frozen-lockfile
      - if: steps.diff.outputs.changed == 'true'
        run: vp run check
      - if: steps.diff.outputs.changed == 'true'
        run: vp test --run
      - if: steps.diff.outputs.changed == 'true'
        run: vp run --filter triad-auth build
      - if: steps.diff.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore(deps): apply socket optimize overrides"
          # The job token is used only here, after check, test, and build passed.
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:master
