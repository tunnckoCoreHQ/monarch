name: ci

on:
  pull_request:
    branches: [master]
  # Lets a job-token workflow ask for the required check on its own branch, since job-token pushes do not trigger pull_request runs.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Same-repository branches only. Fork PRs never run, so they cannot write caches or execute code here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      # SHA-pinned
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # SHA-pinned
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      # SHA-pinned
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          sfw: true
          cache: true
          run-install: true
          node-version: "lts"
      - run: vp run check

  test:
    needs: check
    if: needs.check.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      # SHA-pinned
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # SHA-pinned
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      # SHA-pinned
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          sfw: true
          cache: true
          run-install: true
          node-version: "lts"
      - run: vp run test
