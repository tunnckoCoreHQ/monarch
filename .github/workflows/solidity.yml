name: solidity

on:
  pull_request:
    branches: [master]
    paths:
      - "solidity/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vite.config.ts"
      - ".github/workflows/solidity.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check_test_build:
    # Same-repository branches only. Fork PRs never run, so they cannot write caches or execute code here.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      # SHA-pinned
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # SHA-pinned
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          sfw: true
          cache: true
          run-install: true
          node-version: "lts"
      # SHA-pinned
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          # Pinned to the forge release used locally. 1.8 adds lint rules this code does not pass yet.
          version: v1.7.1
      - run: vp run solidity:check
