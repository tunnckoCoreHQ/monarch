# Publishes package changes to VLT with nightly after TypeScript checks and tests pass.
# Called directly by typescript.yml so automated merges do not depend on workflow_run events.
#
# SECURITY: only master pushes and dispatches may publish. The caller passes the tested commit;
# npm.wgw.lol checks both the caller and this reusable workflow in the GitHub OIDC token.

name: packages-nightly

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
    outputs:
      report:
        value: ${{ jobs.pkgs_nightly.outputs.report }}

permissions: {}

concurrency:
  group: packages-nightly
  cancel-in-progress: false
  queue: max

jobs:
  pkgs_nightly:
    name: Publish and verify nightly
    outputs:
      report: ${{ steps.publish.outputs.report }}
    permissions:
      contents: read
      id-token: write
    if: >-
      github.repository == 'tunnckoCoreHQ/monarch' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - env:
          CHECKED_SHA: ${{ inputs.sha }}
        run: |
          [[ "$CHECKED_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$CHECKED_SHA" origin/master
          git branch -f master "$CHECKED_SHA"
          test -n "$(git diff --name-only HEAD^ HEAD -- packages/)"
      # Retrying an older package commit must still use the publisher from this master workflow.
      - env:
          PUBLISHER_SHA: ${{ github.workflow_sha }}
        run: git show "$PUBLISHER_SHA:scripts/publish-packages.ts" > scripts/publish-packages.ts
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          sfw: true
          cache: true
          run-install: true
          node-version: "lts"
      - id: publish
        run: vp run packages:nightly
        env:
          GH_TOKEN: ${{ github.token }}
