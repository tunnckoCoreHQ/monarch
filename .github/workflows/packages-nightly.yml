name: packages-nightly

on:
  workflow_run:
    workflows: [typescript]
    types: [completed]
    branches: [master]

permissions: {}

concurrency:
  group: packages-nightly
  cancel-in-progress: false

jobs:
  nightly:
    permissions:
      contents: read
      id-token: write
    if: >-
      github.repository == 'tunnckoCoreHQ/monarch' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        run: |
          changed=$(git diff --name-only HEAD^ HEAD -- packages/)
          if [ -n "$changed" ]; then
            echo "packages=true" >> "$GITHUB_OUTPUT"
          else
            echo "packages=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.packages == 'true'
        uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - if: steps.changes.outputs.packages == 'true'
        uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          sfw: true
          cache: true
          run-install: true
          node-version: "lts"
      - if: steps.changes.outputs.packages == 'true'
        run: vp run packages:nightly
        env:
          GH_TOKEN: ${{ github.token }}
