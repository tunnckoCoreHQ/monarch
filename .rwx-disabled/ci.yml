# RWX CI. Checks, tests, and builds every package, TypeScript and Solidity, on every pull request
# and every push to master. After those pass on a master push, the same run publishes nightly
# packages, deploys the apps the push changed, maintains the release PR, and publishes the stable
# versions when the push is the merged release PR. Dispatches run one job by hand on master:
# `rwx dispatch monarch-deploy-prod`, `rwx dispatch monarch-publish-prod`, and
# `rwx dispatch monarch-socket-optimize`.
#
# SECURITY: every secret and OIDC token lives in a vault locked to master, so pull request runs
# get none of them. monarch_nightly and monarch_prod each hold one OIDC token for npm.wgw.lol;
# the Worker maps the nightly vault to the nightly dist-tag and the prod vault to latest.
# monarch_master holds what both stages share, like the npm token and the GitHub PAT. It is
# named after the branch that unlocks it, not after a stage, so the prod tasks read it too.

on:
  github:
    pull_request:
      init:
        commit-sha: ${{ event.git.sha }}
        branch: ${{ event.git.branch }}
        affected-base: ${{ event.github.pull_request.pull_request.base.sha }}
        master: false
        release: false
        app: ""
        job: ""
      status-checks:
        - tasks: check
          name: check
        - tasks: [test, test-solidity]
          name: test
        - tasks: build
          name: build
    # Two push triggers, so each master commit gets a status for exactly the tasks it runs: the
    # merged release PR commit also publishes the stable versions. RWX reports a skipped task in a
    # status as failed, so a status lists only tasks that run for that commit.
    push:
      - if: "${{ event.git.branch == 'master' && event.github.push.head_commit.message !~ '^chore: release packages' }}"
        init:
          commit-sha: ${{ event.git.sha }}
          branch: ${{ event.git.branch }}
          affected-base: ""
          master: true
          release: false
          app: ""
          job: ""
        status-checks:
          - tasks: check
            name: check
          - tasks: [test, test-solidity]
            name: test
          - tasks: build
            name: build
          - tasks: [publish-nightly-vlt, publish-nightly-npm]
            name: publish-nightly
          - tasks: deploy-nightly
            name: deploy-nightly
          - tasks: release-pr
            name: release-pr
      - if: "${{ event.git.branch == 'master' && event.github.push.head_commit.message =~ '^chore: release packages' }}"
        init:
          commit-sha: ${{ event.git.sha }}
          branch: ${{ event.git.branch }}
          affected-base: ""
          master: true
          release: true
          app: ""
          job: ""
        status-checks:
          - tasks: check
            name: check
          - tasks: [test, test-solidity]
            name: test
          - tasks: build
            name: build
          - tasks: [publish-nightly-vlt, publish-nightly-npm]
            name: publish-nightly
          - tasks: deploy-nightly
            name: deploy-nightly
          - tasks: release-pr
            name: release-pr
          - tasks: [publish-prod-vlt, publish-prod-npm]
            name: publish-prod
  dispatch:
    - key: monarch-deploy-prod
      params:
        - key: app
          description: Package name of the app to deploy. Empty deploys every app with deploy:prod.
          default: ""
      init:
        commit-sha: ${{ event.git.sha }}
        branch: ${{ event.git.branch }}
        affected-base: ""
        master: false
        release: false
        app: ${{ event.dispatch.params.app }}
        job: deploy-prod
      target: deploy-prod
      status-checks:
        enabled: true
        name: deploy-prod
    # Deploys the nightly stage by hand, for a deploy that a master push missed or failed.
    - key: monarch-deploy-nightly
      params:
        - key: app
          description: Package name of the app to deploy. Empty deploys every app with deploy:nightly.
          default: ""
      init:
        commit-sha: ${{ event.git.sha }}
        branch: ${{ event.git.branch }}
        affected-base: ""
        master: false
        release: false
        app: ${{ event.dispatch.params.app }}
        job: deploy-nightly
      target: deploy-nightly
      status-checks:
        enabled: true
        name: deploy-nightly
    # Publishes whatever a failed release left missing.
    - key: monarch-publish-prod
      init:
        commit-sha: ${{ event.git.sha }}
        branch: ${{ event.git.branch }}
        affected-base: ""
        master: false
        release: true
        app: ""
        job: ""
      target: [publish-prod-vlt, publish-prod-npm]
      status-checks:
        enabled: true
        name: publish-prod
    - key: monarch-socket-optimize
      init: &socket-optimize-init
        commit-sha: ${{ event.git.sha }}
        branch: ${{ event.git.branch }}
        affected-base: ""
        master: false
        release: false
        app: ""
        job: socket-optimize
      target: socket-optimize
  cron:
    - key: monarch-socket-optimize
      # Mondays 06:00 UTC
      schedule: "0 6 * * 1"
      init: *socket-optimize-init
      target: socket-optimize
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      branch: ${{ event.git.branch }}
      affected-base: ""
      master: false
      release: false
      app: ""
      job: ""

# Runs on master queue in push order, so the nightly publish and the release PR never see an older
# tree after a newer one. A new push to a pull request branch cancels the branch's running run.
concurrency-pools:
  - id: tunnckoCoreHQ/monarch:master
    if: ${{ init.branch == 'master' }}
    capacity: 1
    on-overflow: queue
  - id: tunnckoCoreHQ/monarch:branch-${{ init.branch }}
    if: ${{ init.branch != 'master' }}
    capacity: 1
    on-overflow: cancel-running

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

# Only master runs write the tool caches; pull requests read what master left.
tool-cache:
  vault: monarch_master

aliases:
  # The turbo tasks run on 4 CPUs, like the Depot runners did. The rest use the 2 CPU default.
  turbo-runner: &turbo-runner
    cpus: 4
    memory: 16gb
  turbo-env: &turbo-env
    TURBO_TELEMETRY_DISABLED: 1
    TURBO_SCM_BASE: ${{ init.affected-base }}
    AFFECTED: "${{ init.affected-base == '' ? '' : '--affected' }}"

tasks:
  - key: code
    call: git/clone 2.2.0
    with:
      repository: https://github.com/tunnckoCoreHQ/monarch.git
      ref: ${{ init.commit-sha }}
      # turbo --affected, the nightly publish, and the release PR read the history.
      preserve-git-dir: true
      fetch-full-depth: true

  - key: node
    call: nodejs/install 1.2.0
    with:
      node-version: 24.21.0

  - key: gh
    call: github/install-cli 1.1.0

  - key: foundry
    # Pinned to the forge release used locally. 1.8 adds lint rules this code does not pass yet.
    run: |
      curl -fsSL https://foundry.paradigm.xyz | bash
      "$HOME/.foundry/bin/foundryup" --install v1.7.1
      echo "$HOME/.foundry/bin" > "$RWX_ENV/PATH"

  # The standalone pnpm, as pnpm's CI docs recommend, at the version in packageManager.
  - key: pnpm
    use: code
    filter: [package.json]
    run: |
      export PNPM_HOME=/opt/pnpm
      sudo mkdir -p "$PNPM_HOME" && sudo chown "$(id -un):$(id -gn)" "$PNPM_HOME"
      curl -fsSL https://get.pnpm.io/install.sh |
        PNPM_VERSION="$(jq -r '.packageManager | sub("^pnpm@"; "")' package.json)" SHELL=bash sh -
      echo "$PNPM_HOME" > "$RWX_ENV/PNPM_HOME"
      echo "$PNPM_HOME/bin" > "$RWX_ENV/PATH"

  # Socket Firewall Free blocks known malicious packages while pnpm downloads them.
  - key: deps
    use: [code, node, pnpm]
    run: pnpm dlx sfw pnpm install --frozen-lockfile
    filter:
      - package.json
      - "**/package.json"
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .npmrc
      - patches

  - key: check
    use: [deps, foundry]
    tool-cache: ci-check
    runner: *turbo-runner
    env: *turbo-env
    run: pnpm exec turbo run check $AFFECTED

  # Every Vitest run writes JSON results, which RWX shows as test results. The ethscriptions-rescue
  # tests start anvil from Foundry.
  - key: test
    use: [deps, foundry]
    after: check
    tool-cache: ci-test
    runner: *turbo-runner
    env: *turbo-env
    run: |
      status=0
      pnpm exec turbo run test --filter='!./solidity/*' $AFFECTED -- \
        --reporter=default --reporter=json --outputFile.json=.vitest-results.json || status=$?
      for file in */*/.vitest-results.json; do
        [ -e "$file" ] && cp "$file" "$RWX_TEST_RESULTS/$(dirname "$file" | tr / -).json"
      done
      exit "$status"

  # Five forge runs start at once and race to install solc; compile one project first so the
  # compiler is in place before turbo fans out. The filter keeps only the Solidity projects, the
  # installed packages, and the root files turbo reads, so a push that changes only TypeScript is
  # a cache hit and the task does not run. Without .git, turbo tests every Solidity project, which
  # is what the filter already narrows to.
  - key: test-solidity
    use: [deps, foundry]
    after: check
    tool-cache: ci-test-solidity
    runner: *turbo-runner
    env:
      TURBO_TELEMETRY_DISABLED: 1
    filter:
      - solidity
      - node_modules
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.json
      - tsconfig.json
      - oxlint.config.ts
      - oxfmt.config.ts
      - patches
    run: |
      forge build --root solidity/template
      pnpm exec turbo run test --filter='./solidity/*'

  # Builds the npm packages and the Solidity projects. Workers Builds builds the apps.
  - key: build
    use: [deps, foundry]
    after: [test, test-solidity]
    tool-cache: ci-build
    runner: *turbo-runner
    env: *turbo-env
    run: |
      forge build --root solidity/template
      pnpm exec turbo run build --filter='./packages/*' --filter='./solidity/*' $AFFECTED

  # Publishes nightly versions of the packages this push changed. Each registry has its own task,
  # which builds and publishes only its packages with only its credential.
  - key: publish-nightly-vlt
    if: ${{ init.master }}
    after: [check, test, test-solidity, build]
    use: deps
    cache: false
    env:
      TURBO_TELEMETRY_DISABLED: 1
      # @changesets/changelog-github reads commit and PR data through the GitHub API.
      GITHUB_TOKEN: ${{ vaults.monarch_master.secrets.OLSTENLARCK_HQ_PAT }}
      # pnpm exchanges this OIDC token at npm.wgw.lol, like the Depot OIDC token before.
      NPM_ID_TOKEN: ${{ vaults.monarch_nightly.oidc.vlt }}
    run: bash scripts/publish-nightly.sh vlt

  - key: publish-nightly-npm
    if: ${{ init.master }}
    after: [check, test, test-solidity, build]
    use: deps
    cache: false
    env:
      TURBO_TELEMETRY_DISABLED: 1
      GITHUB_TOKEN: ${{ vaults.monarch_master.secrets.OLSTENLARCK_HQ_PAT }}
      NPM_TOKEN: ${{ vaults.monarch_master.secrets.NPM_TOKEN }}
    run: bash scripts/publish-nightly.sh npm

  # Opens or updates the release PR from pending changesets.
  - key: release-pr
    if: ${{ init.master }}
    after: [check, test, test-solidity, build]
    use: [deps, gh]
    cache: false
    env:
      GITHUB_TOKEN: ${{ vaults.monarch_master.secrets.OLSTENLARCK_HQ_PAT }}
    run: bash scripts/release-pr.sh

  # Publishes the stable versions with latest, then pushes the package tags and creates the
  # GitHub Releases. Runs for the merged release PR commit, or by hand to finish a failed release.
  # Like the nightly, each registry has its own task.
  - key: publish-prod-vlt
    if: ${{ init.release }}
    after: [check, test, test-solidity, build]
    use: [deps, gh]
    cache: false
    env:
      TURBO_TELEMETRY_DISABLED: 1
      GITHUB_TOKEN: ${{ vaults.monarch_master.secrets.OLSTENLARCK_HQ_PAT }}
      NPM_ID_TOKEN: ${{ vaults.monarch_prod.oidc.vlt }}
    run: bash scripts/publish-prod.sh vlt

  - key: publish-prod-npm
    if: ${{ init.release }}
    after: [check, test, test-solidity, build]
    use: [deps, gh]
    cache: false
    env:
      TURBO_TELEMETRY_DISABLED: 1
      GITHUB_TOKEN: ${{ vaults.monarch_master.secrets.OLSTENLARCK_HQ_PAT }}
      NPM_TOKEN: ${{ vaults.monarch_master.secrets.NPM_TOKEN }}
    run: bash scripts/publish-prod.sh npm

  # Deploys the apps this push changed through their deploy:nightly scripts. master takes squash
  # merges, so the pushed commit's parent is the previous master. A direct push of several commits
  # only counts the last one.
  - key: deploy-nightly
    if: ${{ init.master || init.job == 'deploy-nightly' }}
    after: [check, test, test-solidity, build]
    use: deps
    cache: false
    env:
      TURBO_TELEMETRY_DISABLED: 1
      APP: ${{ init.app }}
      JOB: ${{ init.job }}
      TURBO_SCM_BASE: ${{ init.commit-sha }}^1
      TURBO_SCM_HEAD: ${{ init.commit-sha }}
      COMMIT_SHA: ${{ init.commit-sha }}
    # A master push deploys the apps it changed; the dispatch deploys one app, or every app.
    # badges.wgw.lol is skipped: the app is going away. --continue lets the other apps deploy when
    # one fails.
    run: |
      if [ -n "$APP" ]; then
        scope=(--filter="$APP")
      elif [ "$JOB" = deploy-nightly ]; then
        scope=(--filter='!badges.wgw.lol')
      else
        scope=(--affected --filter='!badges.wgw.lol')
      fi
      pnpm exec turbo run deploy:nightly "${scope[@]}" --continue

  # Deploys apps to production through their deploy:prod scripts, only by dispatch. Without the
  # app param it deploys every app that has a deploy:prod script.
  - key: deploy-prod
    if: ${{ init.job == 'deploy-prod' }}
    use: deps
    cache: false
    env:
      TURBO_TELEMETRY_DISABLED: 1
      APP: ${{ init.app }}
      COMMIT_SHA: ${{ init.commit-sha }}
    run: pnpm exec turbo run deploy:prod ${APP:+--filter="$APP"}

  # Runs Socket Optimize. Verified overrides are pushed straight to master by the PAT owner, a
  # repository admin. When the overrides fail verification, the diff is opened as a pull request
  # that needs attention. When there is nothing to push, an issue links the failed run.
  - key: socket-optimize
    if: ${{ init.job == 'socket-optimize' }}
    use: [deps, gh]
    cache: false
    env:
      TURBO_TELEMETRY_DISABLED: 1
      GITHUB_TOKEN: ${{ vaults.monarch_master.secrets.OLSTENLARCK_HQ_PAT }}
      SOCKET_SECURITY_API_TOKEN: ${{ vaults.monarch_master.secrets.SOCKET_SECURITY_API_TOKEN }}
    run: bash scripts/socket-optimize.sh
