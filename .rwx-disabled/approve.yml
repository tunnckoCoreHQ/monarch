# RWX webhook. Approves a pull request when tunnckoCore comments /approve on it. The approval comes
# from the PAT owner, which satisfies the approval the master ruleset requires. A repository
# webhook on GitHub sends the issue_comment events here, signed with GITHUB_WEBHOOK_SECRET.
#
# SECURITY: the task runs no repository code. It checks the GitHub signature before it reads the
# payload, and the PAT is used only to approve. Keep the author gate; do not extend it to other users.

on:
  webhook:
    key: monarch-approve
    if: ${{ json(event.webhook.body).comment.user.login == 'tunnckoCore' && contains(json(event.webhook.body).comment.body, '/approve') }}
    init:
      headers: ${{ event.webhook.headers }}
      body: ${{ event.webhook.body }}
    status-checks: false

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: gh
    call: github/install-cli 1.1.0

  - key: approve
    use: gh
    cache: false
    env:
      HEADERS: ${{ init.headers }}
      BODY: ${{ init.body }}
      WEBHOOK_SECRET: ${{ vaults.monarch_master.secrets.GITHUB_WEBHOOK_SECRET }}
      GITHUB_TOKEN: ${{ vaults.monarch_master.secrets.OLSTENLARCK_HQ_PAT }}
    run: |
      expected="sha256=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | cut -d' ' -f2)"
      signature=$(jq -r '."x-hub-signature-256" // empty' <<< "$HEADERS")
      if [ "$signature" != "$expected" ]; then
        echo "The GitHub signature does not match" >&2
        exit 1
      fi
      pr=$(jq -r 'select(.action == "created" and .issue.pull_request != null and .comment.user.login == "tunnckoCore") | .issue.number' <<< "$BODY")
      if [ -z "$pr" ]; then
        echo "Not a new /approve comment from tunnckoCore on a pull request"
        exit 0
      fi
      gh pr review "$pr" --repo tunnckoCoreHQ/monarch --approve
