packages:
  - "apps/*"
  - "chrome-extensions/*"
  - "packages/*"
  - "solidity/*"

allowBuilds:
  esbuild: true
  msgpackr-extract: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20260831.1"
  - "@changesets/apply-release-plan@8.1.0"
  - "@changesets/cli@3.0.2"
  - "@changesets/git@4.0.1"
  - "@changesets/read@1.0.1"
  - "@astrojs/cloudflare@15.0.0-beta.0"
  - astro@7.4.0-beta.0
  - cf@1.0.0-beta.10
  - "@turbo/darwin-64@2.11.7"
  - "@turbo/darwin-arm64@2.11.7"
  - "@turbo/linux-64@2.11.7"
  - "@turbo/linux-arm64@2.11.7"
  - "@turbo/windows-64@2.11.7"
  - "@turbo/windows-arm64@2.11.7"
  - turbo@2.11.7

catalogMode: prefer

catalogs:
  default:
    "@coinbase/cdp-sdk": ^1.57.0
    "@hono/node-server": ^2.0.6
    "@x402/core": ^2.27.0
    "@x402/evm": ^2.27.0
    "@x402/hono": ^2.27.0
    "@x402/svm": ^2.27.0
    hono: ^4.12.27
    astro: 7.4.0-beta.0
    "@astrojs/cloudflare": 15.0.0-beta.0
    cf: 1.0.0-beta.10
    "@cloudflare/vite-plugin": 2.0.0-beta.sha-238e489d5
    vite: ^8.0.13
    "@openzeppelin/contracts": 5.6.1
    solady: 0.1.26
    erc721a: 4.3.0
    viem: 2.56.9
    jose: ^6.2.12
    oxlint: 1.86.0
    oxfmt: 0.71.0
    oxlint-tsgolint: 7.0.2003
    ultracite: 7.12.2
    vitest: 5.0.3
    "@vitest/coverage-v8": 5.0.3
    turbo: 2.11.7
    tsdown: 0.23.0
    socket: ^1.4.1
    effect: ^4.0.0
    "@effect/platform-node": ^4.0.0
    "@effect/vitest": ^4.0.0
    zod: ^4.6.5
    valibot: ^1.5.0
    '@standard-schema/spec': ^1.1.0
    badgen: 3.3.2
  types:
    "@cloudflare/workers-types": 5.20260928.1
    "@types/bun": ^1.4.2
    "@types/node": ^24
    typescript: 7.0.2
  crypto:
    "@noble/curves": 2.4.0
    "@noble/hashes": 2.4.0
    "@scure/base": 2.4.0
    "@scure/bip32": 2.4.0
    "@scure/btc-signer": 2.4.1
  better-auth:
    auth: 1.7.0-rc.4
    "@better-auth/cimd": 1.7.0-rc.4
    "@better-auth/oauth-provider": 1.7.0-rc.4
    "@better-auth/passkey": 1.7.0-rc.4
    "better-auth": 1.7.0-rc.4

overrides:
  # One workerd for the whole workspace: cf and @cloudflare/vite-plugin pin different ones.
  "workerd": "1.20260930.2"
  "miniflare": "5.20260930.0-alpha"
  "is-unicode-supported": "npm:@socketregistry/is-unicode-supported@^1"
  "yocto-spinner": "npm:@socketregistry/yocto-spinner@^1"
  "shell-quote": "npm:shell-quote@^1"
  "hasown": "npm:@socketregistry/hasown@^1"
  "has-tostringtag": "npm:@socketregistry/has-tostringtag@^1"
  "has-symbols": "npm:@socketregistry/has-symbols@^1"
  "gopd": "npm:@socketregistry/gopd@^1"
  "function-bind": "npm:@socketregistry/function-bind@^1"
  "es-set-tostringtag": "npm:@socketregistry/es-set-tostringtag@^1"
  "es-define-property": "npm:@socketregistry/es-define-property@^1"

patchedDependencies:
  "@better-auth/oauth-provider@1.7.0-rc.4": patches/@better-auth__oauth-provider@1.7.0-rc.4.patch
