packages:
  - "apps/*"
  - "packages/*"
  - "solidity/*"

allowBuilds:
  esbuild: true
  msgpackr-extract: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20260831.1"
  - "@changesets/apply-release-plan@8.1.0"
  - "@changesets/cli@3.0.2"
  - "@changesets/git@4.0.1"
  - "@changesets/read@1.0.1"
  - "@astrojs/cloudflare@15.0.0-beta.0"
  - astro@7.4.0-beta.0
  - cf@1.0.0-beta.10

catalogMode: prefer

catalogs:
  default:
    "@coinbase/cdp-sdk": ^1.56.0
    "@hono/node-server": ^2.0.6
    "@x402/core": ^2.26.0
    "@x402/evm": ^2.26.0
    "@x402/hono": ^2.26.0
    "@x402/svm": ^2.26.0
    hono: ^4.12.27
    vite: npm:@voidzero-dev/vite-plus-core@0.2.8
    vite-plus: 0.2.8
    "@vitest/coverage-v8": 4.1.10
    astro: 7.4.0-beta.0
    "@astrojs/cloudflare": 15.0.0-beta.0
    cf: 1.0.0-beta.10
    "@cloudflare/vite-plugin": 2.0.0-beta.sha-238e489d5
    "@openzeppelin/contracts": 5.6.1
    solady: 0.1.26
    erc721a: 4.3.0
    viem: 2.56.8
    jose: ^6.2.12
    "@oxlint/plugins": 1.83.0
    oxlint: 1.83.0
  types:
    "@cloudflare/workers-types": 5.20260921.1
    "@types/bun": ^1.4.2
    "@types/node": ^24
    typescript: 7.0.2
  crypto:
    "@noble/curves": 2.4.0
    "@noble/hashes": 2.4.0
    "@scure/base": 2.4.0
    "@scure/bip32": 2.4.0
    "@scure/btc-signer": 2.4.1
  better-auth:
    auth: 1.7.0-rc.4
    "@better-auth/cimd": 1.7.0-rc.4
    "@better-auth/oauth-provider": 1.7.0-rc.4
    "@better-auth/passkey": 1.7.0-rc.4
    "better-auth": 1.7.0-rc.4

overrides:
  "yocto-spinner": "npm:@socketregistry/yocto-spinner@^1"
  "shell-quote": "npm:shell-quote@^1"
  "hasown": "npm:@socketregistry/hasown@^1"
  "has-tostringtag": "npm:@socketregistry/has-tostringtag@^1"
  "has-symbols": "npm:@socketregistry/has-symbols@^1"
  "gopd": "npm:@socketregistry/gopd@^1"
  "function-bind": "npm:@socketregistry/function-bind@^1"
  "es-set-tostringtag": "npm:@socketregistry/es-set-tostringtag@^1"
  "es-define-property": "npm:@socketregistry/es-define-property@^1"
  vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

patchedDependencies:
  "@better-auth/oauth-provider@1.7.0-rc.4": patches/@better-auth__oauth-provider@1.7.0-rc.4.patch
