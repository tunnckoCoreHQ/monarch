[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["node_modules"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
allow_paths = ["../../node_modules"]
fs_permissions = [{ access = "read-write", path = "./preview" }]
deny = "warnings"
remappings = [
  "erc721a/=node_modules/erc721a/contracts/",
  "solady/=node_modules/solady/src/",
  "forge-std/=node_modules/forge-std/src/",
]

[lint]
# every narrowing cast is bounded by the palette and mask ranges (see NekoBase.sol)
exclude_lints = ["unsafe-typecast"]
severity = ["high", "med", "low"]
ignore = ["node_modules/**"]

[fuzz]
runs = 256

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
