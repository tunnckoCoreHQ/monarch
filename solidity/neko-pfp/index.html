<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>0xNeko preview</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div id="grid" class="mt-1 grid grid-cols-[repeat(auto-fill,150px)] gap-1"></div>
    <script>
      const grid = document.getElementById("grid");
      const names = [
        "unrevealed",
        ...Array.from({ length: 4663 }, (_, i) => String(i + 1).padStart(4, "0")),
      ];
      const io = new IntersectionObserver(
        (entries) => {
          for (const entry of entries) {
            if (!entry.isIntersecting) continue;
            entry.target.src = entry.target.dataset.src;
            io.unobserve(entry.target);
          }
        },
        { rootMargin: "600px" },
      );
      for (const name of names) {
        const img = document.createElement("img");
        img.dataset.src = `${name}.svg`;
        img.className = "h-[150px] w-[150px] rounded-fullx";
        grid.append(img);
        io.observe(img);
      }
    </script>
  </body>
</html>
