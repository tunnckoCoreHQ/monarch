      body {
        margin: 0;

      main {

        margin: auto;
        padding: 48px 32px;
      }
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 40px;
      }
      h1 {
        margin: 0;
        font-family: system-ui, sans-serif;
        font-size: clamp(48px, 7vw, 80px);
        font-weight: 800;
        letter-spacing: -0.065em;
        line-height: 1;
      }
      header p {
        margin: 0;
        color: oklch(0.73 0.02 280);
        font-size: 14px;
      }
      figure {
        margin: 0;
        width: 256px;
      }
      section {
        display: grid;
        grid-template-columns: repeat(auto-fit, 256px);
        justify-content: center;
        column-gap: 24px;
        row-gap: 32px;
      }
      svg {
        display: block;
        width: 256px;
        height: 256px;
        image-rendering: pixelated;
      }
      figcaption {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding-top: 12px;
        font-size: 13px;
      }
      figcaption span:last-child {
        color: oklch(0.66 0.02 280);
      }
      @media (max-width: 600px) {
        main {
          padding: 32px 16px;
        }
        header {
          align-items: flex-start;
          flex-direction: column;
          gap: 16px;
          margin-bottom: 32px;
        }
      }
    </style>
